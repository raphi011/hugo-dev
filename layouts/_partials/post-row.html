{{- /* Context: a Page, or dict "page" Page "fmt" dateFormat */ -}}
{{- $p := . }}{{ $fmt := site.Params.listDateFormat }}
{{- if reflect.IsMap . }}{{ $p = .page }}{{ with .fmt }}{{ $fmt = . }}{{ end }}{{ end }}
{{- with $p }}
<a class="post-row" href="{{ .RelPermalink }}">
  <span class="post-title">{{ .LinkTitle }}</span>
  <span class="leader" aria-hidden="true"></span>
  <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format $fmt }}</time>
</a>
{{- end }}
